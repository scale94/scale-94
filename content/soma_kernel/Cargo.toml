[package]
name = "dh-ec-kernel"
version = "1.0.0"
edition = "2021"
authors = ["scale94"]
description = "Diffie-Hellman + Elliptic Curve key exchange · Signal vs Threema cryptographic comparison kernel"

[dependencies]
# Pure-Rust elliptic curve cryptography (no C bindings)
# Curve25519 — used by Signal's X3DH protocol
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# SHA2 for HKDF
sha2 = "0.10"

# HMAC-based Key Derivation Function
hkdf = "0.12"

# Cryptographically secure random number generation
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# Hex encoding for display
hex = "0.4"

# Zeroize sensitive material from memory on drop
zeroize = { version = "1.7", features = ["derive"] }
