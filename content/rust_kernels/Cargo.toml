[package]
name        = "scale94-kernels"
version     = "0.1.0"
edition     = "2021"
description = "Soma 9.4 — Native Rust kernel execution layer (wasm-bindgen targets)"

[lib]
# cdylib: required for wasm-pack to emit a WebAssembly dynamic library.
# rlib:   retained so unit tests can be run with `cargo test` on native target.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# ── DH-EC Kernel (dh_ec.rs) ─────────────────────────────────────────────────
# Pure-Rust Curve25519 ECDH (Signal X3DH + Threema NaCl simulation)
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2         = "0.10"
hkdf         = "0.12"
rand_core    = { version = "0.6", features = ["getrandom"] }
# getrandom js feature: enables crypto.getRandomValues() on WASM target
getrandom    = { version = "0.2", features = ["js"] }

# ── Gray-Scott + Classified kernels ─────────────────────────────────────────
# js-sys: required for js_sys::Array return type in grayscott_params / classified_params
js-sys       = "0.3"
# ML-KEM-768: FIPS 203 compliant post-quantum key encapsulation
ml-kem       = "0.2"
# hex: encode key bytes as uppercase hex strings for terminal output
hex          = "0.4"
serde_json   = { version = "1", default-features = false, features = ["alloc"] }

# ── Classified: secure memory erasure ───────────────────────────────────────
# zeroize: overwrites memory with zeros via compiler_fence — prevents
# optimisers from eliding the wipe. Ensures ephemeral key material in WASM
# linear memory is cleared after each classified session cycle.
zeroize      = "1"

# ── Tesseract-Vault kernel ───────────────────────────────────────────────────
# Architecture ported from: https://github.com/dollspace-gay/Tesseract-Vault
# Credit: dollspace-gay · Tesseract-Vault Project
#
# aes-gcm:  AES-256-GCM authenticated encryption (AEAD)
# argon2:   Argon2id key derivation (RFC 9106) — memory-hard KDF
# blake3:   BLAKE3 cryptographic hash — integrity binding
# ml-dsa:   ML-DSA-87 post-quantum signatures (FIPS 204) — feature = zeroize
aes-gcm      = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
argon2       = { version = "0.5",  default-features = false, features = ["alloc"] }
blake3       = { version = "1.5",  default-features = false }
ml-dsa       = { version = "0.1.0-rc.5", features = ["zeroize"] }

[profile.release]
# Optimize for size — WASM binary is served over the network.
opt-level      = "s"
lto            = true
codegen-units  = 1      # single unit → full cross-function inlining via LLVM
panic          = "abort" # strips unwinding machinery (~8–12KB saved in WASM binary)
