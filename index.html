<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./scale-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MERCURY TERMINAL</title>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Mercury Terminal — Post-Quantum Olfactory Sovereignty Protocol" />
    <style>
      body { background-color: black; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pane-probe shim — automation only. The embedded preview pane reports
      // document.hidden=true, so native rAF never fires and the rAF-driven
      // boot stalls. Installed BEFORE the module graph so BootSequence's very
      // first requestAnimationFrame lands on the polyfill. Inert unless on
      // localhost with sessionStorage.__paneProbe set (session-scoped so a
      // probe flag can never leak into a later human dev session).
      if (location.hostname === 'localhost' && sessionStorage.getItem('__paneProbe')) {
        Object.defineProperty(Document.prototype, 'hidden', { get() { return false; }, configurable: true });
        Object.defineProperty(Document.prototype, 'visibilityState', { get() { return 'visible'; }, configurable: true });
        window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
        window.cancelAnimationFrame = id => clearTimeout(id);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Apocalypse Protocol — register Service Worker for offline-first PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('[SW] Registered — scope:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
